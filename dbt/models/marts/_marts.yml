version: 2

models:
  - name: dim_date
    description: Un giorno, dal 2019 al giorno prima della data di taglio.
    columns:
      - name: date
        tests: [unique, not_null]

  - name: dim_users
    description: Un cliente, con canale di iscrizione unificato e coorte (mese del primo ordine non cancellato).
    columns:
      - name: user_id
        tests: [unique, not_null]
      - name: signup_channel
        tests: [not_null]

  - name: dim_products
    description: Un prodotto.
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: fct_order_items
    description: Una riga d'ordine. Base di ricavi, margine e resi.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
              config:
                severity: warn

  - name: fct_orders
    description: Un ordine. Base di ordini, valore medio, nuovi clienti e clienti di ritorno, coorti.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
              config:
                severity: warn

  - name: fct_sessions
    description: Una sessione web. Funnel e canali di sessione seguono regole fisse del generatore.
    columns:
      - name: session_id
        tests: [unique, not_null]

  - name: metricflow_time_spine
    description: Calendario per MetricFlow.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests: [unique, not_null]
